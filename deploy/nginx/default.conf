server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 后端在同一个宿主机的回环地址上（见 docker-compose.yml 的 extra_hosts）。
    #
    # 这里刻意用「静态 proxy_pass」而不是 resolver + 变量：
    # host.docker.internal 来自容器 /etc/hosts，而 nginx 的 resolver 是纯 DNS 客户端、
    # 不读 /etc/hosts，用变量形式反而解析不了。
    # 而 host.docker.internal 指向宿主机网关 IP，容器重建不会变，所以静态解析是安全的。
    # （对比：如果后端在同一个 Docker 网络里按容器名访问，就必须用 resolver + 变量，
    #   因为容器 IP 会变。monorepo 版本的配置就是那样。）
    location /api/ {
        proxy_pass http://host.docker.internal:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 跟着后端最长任务耗时（图片生成 600s）放宽。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
